<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=../index.html">
  <title>Интеонмтека</title>
  <script>
    // The landing page sees this redirect as an internal link, even on a fresh visit.
    try {
      const navigation = performance.getEntriesByType('navigation')[0]?.type;
      if (navigation === 'reload' || (navigation !== 'back_forward' && !document.referrer.startsWith(location.origin + '/'))) {
        sessionStorage.removeItem('inteon.courtyard.phase-ms');
      }
    } catch {}
    location.replace(location.protocol === 'file:' ? '../index.html' : '../');
  </script>
</head>
<body><a href="../index.html">Открыть пульт</a></body>
</html>
