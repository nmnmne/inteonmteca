<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Варианты второго логотипа — inteonmteca</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070706;
  --surface: #0b0c09;
  --surface-raised: #10120d;
  --border: #292d23;
  --border-hover: #56613b;
  --ink: #f1eee7;
  --muted: #95988a;
  --acid: #d3ff69;
  --warm: #c99467;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  padding: 20px;
  color: var(--ink);
  background: var(--bg);
  font-family: "Segoe UI", Arial, sans-serif;
}
main { width: min(100%, 1260px); }
header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  padding: 0 0 16px;
  border-bottom: 1px solid #282a22;
  margin-bottom: 14px;
}
.kicker, .index, .selection-label {
  color: var(--acid);
  font: 10px/1.4 Consolas, "Courier New", monospace;
  letter-spacing: .15em;
  text-transform: uppercase;
}
h1 {
  margin: 5px 0 0;
  font-size: clamp(21px, 3vw, 30px);
  font-weight: 450;
  letter-spacing: -.04em;
}
.note {
  max-width: 390px;
  margin: 0;
  color: var(--muted);
  font: 12px/1.5 Consolas, "Courier New", monospace;
  text-align: right;
}
.selection-bar {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-height: 30px;
  margin: 0 0 13px;
  color: var(--muted);
  font-size: 12px;
}
#selection { color: var(--ink); }
.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 11px;
}
.card {
  position: relative;
  min-width: 0;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: inherit;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
}
.card:hover { border-color: var(--border-hover); background: var(--surface-raised); transform: translateY(-2px); }
.card:focus-visible { outline: 2px solid var(--acid); outline-offset: 3px; }
.card[aria-pressed="true"] { border-color: var(--acid); background: #11150b; }
.art {
  position: relative;
  display: grid;
  place-items: center;
  height: 130px;
  overflow: hidden;
  border-radius: 3px;
  background: transparent;
  isolation: isolate;
}
.mark { position: absolute; inset: 0; overflow: hidden; }
.logo {
  position: absolute;
  top: 50%; left: 50%;
  display: block;
  width: 105%; max-width: none; height: auto;
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.ghost { opacity: .56; }
.meta {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 8px;
  padding: 11px 2px 1px;
}
.index { color: #7f8767; letter-spacing: .06em; }
.name { overflow: hidden; font-size: 13px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
.check { color: var(--acid); font: 11px Consolas, monospace; opacity: 0; }
.card[aria-pressed="true"] .check { opacity: 1; }
.detail { margin: 5px 0 1px 29px; color: var(--muted); font: 10px/1.4 Consolas, "Courier New", monospace; }

/* 01 — исходное изображение без новой обработки */
.v01 .logo { opacity: .97; }
/* 02 — второй слой возвращает исходному штриху кислотный отблеск */
.v02 .ghost { filter: sepia(1) saturate(5) hue-rotate(25deg) brightness(1.18); opacity: .64; transform: translate(-49.5%, -51.5%); }
.v02 .base { opacity: .94; }
.v02 .art::before { position: absolute; inset: 22% 12%; content: ""; background: radial-gradient(ellipse, #caff5730, transparent 72%); filter: blur(13px); }
/* 03 — лёгкое смещение двух белых отпечатков */
.v03 .ghost { filter: grayscale(1) brightness(1.8) contrast(1.12); opacity: .42; transform: translate(-50.8%, -47.5%); }
.v03 .base { opacity: .92; }
/* 04 — спокойная полоса сканирования */
.v04 .scan {
  position: absolute; z-index: 2; inset: -100% 0;
  background: linear-gradient(180deg, transparent 46%, #d3ff6908 48%, #d3ff6960 50%, #d3ff6910 52%, transparent 54%);
  mix-blend-mode: screen;
  animation: scan 4.8s linear infinite;
}
@keyframes scan { to { transform: translateY(200%); } }
/* 05 — короткие цветные разрывы сигнала */
.v05 .ghost { filter: sepia(1) saturate(5) hue-rotate(22deg); opacity: .58; transform: translate(-50.8%, -49%); clip-path: inset(32% 0 48% 0); }
.v05 .ghost-two { filter: sepia(.55) saturate(2.3) hue-rotate(335deg); opacity: .39; transform: translate(-49.2%, -52%); clip-path: inset(61% 0 19% 0); }
.v05 .base { opacity: .91; }
/* 06 — сухой меловой штрих, почти без цвета */
.v06 .base { filter: grayscale(1) contrast(1.28) brightness(1.18); opacity: .94; }
.v06 .art::after { position: absolute; inset: 0; content: ""; opacity: .1; background: repeating-linear-gradient(0deg, transparent 0 3px, #e4e6d510 3px 4px); }
/* 07 — сам штрих уходит в зелёный фосфор */
.v07 .base { filter: sepia(1) saturate(2.8) hue-rotate(27deg) brightness(1.1); opacity: .86; }
.v07 .ghost { filter: grayscale(1) brightness(2); opacity: .58; transform: translate(-50.3%, -50.5%); }
/* 08 — слабое отражение под знаком */
.v08 .reflection { top: 64%; opacity: .17; transform: translate(-50%, 0) scaleY(-.52); mask-image: linear-gradient(180deg, #000 5%, transparent 86%); }
.v08 .base { opacity: .95; }
/* 09 — тёплый второй отпечаток, белый оригинал остаётся главным */
.v09 .ghost { filter: sepia(1) saturate(2.2) hue-rotate(342deg) brightness(1.05); opacity: .57; transform: translate(-49.6%, -50.7%); }
.v09 .base { opacity: .94; }
.v09 .art::before { position: absolute; inset: 25% 16%; content: ""; background: radial-gradient(ellipse, #c9946724, transparent 74%); filter: blur(12px); }
/* 10 — приглушённый след с тонким зелёным эхом */
.v10 .base { opacity: .58; filter: grayscale(.35) contrast(.92); }
.v10 .ghost { filter: sepia(1) saturate(3.4) hue-rotate(27deg); opacity: .3; transform: translate(-50%, -50%) scale(1.025); }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 820px) {
  body { padding: 14px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  header { align-items: start; flex-direction: column; gap: 8px; }
  .note { text-align: left; }
  .art { height: 118px; }
}
@media (max-width: 420px) {
  body { padding: 10px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .card { padding: 6px; }
  .art { height: 102px; }
  .meta { gap: 5px; padding-top: 8px; }
  .name { font-size: 12px; }
  .detail { margin-left: 24px; font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="kicker">второй знак / 10 вариантов</div>
      <h1>Рукописное лого inteonmteca</h1>
    </div>
    <p class="note">Один исходный знак, десять вариантов обработки.<br>Нажми на карточку, чтобы отметить выбор.</p>
  </header>
  <div class="selection-bar" aria-live="polite">
    <span class="selection-label">Выбрано</span>
    <span id="selection">пока ничего</span>
  </div>
  <section class="grid" aria-label="Варианты второго логотипа">
    <button class="card v01" type="button" aria-pressed="false" data-name="Исходник" aria-label="Выбрать вариант 01 — Исходник">
      <span class="art"><span class="mark"><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">01</span><span class="name">Исходник</span><span class="check">✓</span></span>
      <span class="detail">снимок без обработки</span>
    </button>
    <button class="card v02" type="button" aria-pressed="false" data-name="Фосфорный след" aria-label="Выбрать вариант 02 — Фосфорный след">
      <span class="art"><span class="mark"><img class="logo ghost" src="assets/logo-handwriting.svg" alt=""><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">02</span><span class="name">Фосфорный след</span><span class="check">✓</span></span>
      <span class="detail">мягкий лаймовый отблеск</span>
    </button>
    <button class="card v03" type="button" aria-pressed="false" data-name="Двойной отпечаток" aria-label="Выбрать вариант 03 — Двойной отпечаток">
      <span class="art"><span class="mark"><img class="logo ghost" src="assets/logo-handwriting.svg" alt=""><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">03</span><span class="name">Двойной отпечаток</span><span class="check">✓</span></span>
      <span class="detail">едва заметный сдвиг слоёв</span>
    </button>
    <button class="card v04" type="button" aria-pressed="false" data-name="Скан-линия" aria-label="Выбрать вариант 04 — Скан-линия">
      <span class="art"><span class="mark"><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span><span class="scan" aria-hidden="true"></span></span>
      <span class="meta"><span class="index">04</span><span class="name">Скан-линия</span><span class="check">✓</span></span>
      <span class="detail">проходящий луч по знаку</span>
    </button>
    <button class="card v05" type="button" aria-pressed="false" data-name="Разрыв сигнала" aria-label="Выбрать вариант 05 — Разрыв сигнала">
      <span class="art"><span class="mark"><img class="logo ghost ghost-two" src="assets/logo-handwriting.svg" alt=""><img class="logo ghost" src="assets/logo-handwriting.svg" alt=""><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">05</span><span class="name">Разрыв сигнала</span><span class="check">✓</span></span>
      <span class="detail">тонкие цветные смещения</span>
    </button>
    <button class="card v06" type="button" aria-pressed="false" data-name="Меловой штрих" aria-label="Выбрать вариант 06 — Меловой штрих">
      <span class="art"><span class="mark"><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">06</span><span class="name">Меловой штрих</span><span class="check">✓</span></span>
      <span class="detail">сухой белый рисунок</span>
    </button>
    <button class="card v07" type="button" aria-pressed="false" data-name="Лаймовые чернила" aria-label="Выбрать вариант 07 — Лаймовые чернила">
      <span class="art"><span class="mark"><img class="logo base" src="assets/logo-handwriting.svg" alt=""><img class="logo ghost" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">07</span><span class="name">Лаймовые чернила</span><span class="check">✓</span></span>
      <span class="detail">зелёный штрих с белым ядром</span>
    </button>
    <button class="card v08" type="button" aria-pressed="false" data-name="Отражение" aria-label="Выбрать вариант 08 — Отражение">
      <span class="art"><span class="mark"><img class="logo reflection" src="assets/logo-handwriting.svg" alt=""><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">08</span><span class="name">Отражение</span><span class="check">✓</span></span>
      <span class="detail">слабый след под знаком</span>
    </button>
    <button class="card v09" type="button" aria-pressed="false" data-name="Тёплый отзвук" aria-label="Выбрать вариант 09 — Тёплый отзвук">
      <span class="art"><span class="mark"><img class="logo ghost" src="assets/logo-handwriting.svg" alt=""><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">09</span><span class="name">Тёплый отзвук</span><span class="check">✓</span></span>
      <span class="detail">янтарный слой под белым</span>
    </button>
    <button class="card v10" type="button" aria-pressed="false" data-name="Память сигнала" aria-label="Выбрать вариант 10 — Память сигнала">
      <span class="art"><span class="mark"><img class="logo ghost" src="assets/logo-handwriting.svg" alt=""><img class="logo base" src="assets/logo-handwriting.svg" alt=""></span></span>
      <span class="meta"><span class="index">10</span><span class="name">Память сигнала</span><span class="check">✓</span></span>
      <span class="detail">приглушённый зелёный фантом</span>
    </button>
  </section>
</main>
<script>
const cards = [...document.querySelectorAll('.card')];
const selection = document.querySelector('#selection');
for (const card of cards) card.addEventListener('click', () => {
  for (const item of cards) item.setAttribute('aria-pressed', String(item === card));
  selection.textContent = `${card.querySelector('.index').textContent} · ${card.dataset.name}`;
});
</script>
</body>
</html>
